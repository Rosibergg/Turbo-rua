
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Rua</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14251c;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:12px;left:12px;font-weight:bold;font-size:20px;text-shadow:2px 2px #000}
#menu{position:absolute;inset:0;background:#07130ddd;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.panel{background:#203a2c;padding:25px;border-radius:20px;border:2px solid #70b86a;max-width:350px}
h1{color:#ffcf42;font-size:36px}
button{background:#ffc83d;border:0;padding:15px 25px;border-radius:12px;font-size:18px;font-weight:bold;margin:8px}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 25px}
.controls button{background:#152a25dd;color:white;font-size:30px;width:75px;height:70px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">🏁 TURBO RUA<br><span id="score">0 metros</span></div>
<div class="controls">
<button id="left">◀</button>
<button id="right">▶</button>
</div>
<div id="menu">
<div class="panel">
<h1>🏎️ TURBO RUA</h1>
<p>Desvie dos carros e tente bater seu recorde!</p>
<p>Use as setas para mudar de faixa.</p>
<button id="start">COMEÇAR!</button>
</div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,road,player=1,cars=[],score=0,speed=5,playing=false,spawn=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;road=W*.78}
onresize=resize;resize();
function laneX(n){return W/2+(n-1)*road/3}
function car(x,y,color,playerCar=false){
ctx.fillStyle='#111';ctx.fillRect(x-22,y+8,44,65);
ctx.fillStyle=color;ctx.fillRect(x-19,y,38,65);
ctx.fillStyle='#9deaff';ctx.fillRect(x-14,y+12,28,17);
ctx.fillStyle='#263b4a';ctx.fillRect(x-13,y+36,26,12);
ctx.fillStyle='white';ctx.fillRect(x-16,y+3,7,5);ctx.fillRect(x+9,y+3,7,5);
}
function draw(){
ctx.fillStyle='#397c42';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#333';ctx.fillRect((W-road)/2,0,road,H);
ctx.fillStyle='white';
for(let y=-50;y<H;y+=65){
let yy=(y+score*5)%H;
ctx.fillRect(W/2-road/6,yy,4,32);
ctx.fillRect(W/2+road/6,yy,4,32);
}
cars.forEach(a=>car(laneX(a.lane),a.y,a.color));
car(laneX(player),H*.76,'#168de0',true);
}
function loop(){
if(!playing)return;
ctx.clearRect(0,0,W,H);
score+=speed*.08;
document.getElementById('score').textContent=Math.floor(score)+' metros';
spawn++;
if(spawn>55){spawn=0;cars.push({lane:Math.floor(Math.random()*3),y:-80,color:['#e74c3c','#e9b43b','#a56bd5'][Math.floor(Math.random()*3)]});}
cars.forEach(a=>a.y+=speed);
cars=cars.filter(a=>a.y<H+80);
for(let a of cars){
if(a.lane===player&&a.y>H*.76-55&&a.y<H*.76+55){
playing=false;
document.querySelector('#menu h1').textContent='FIM DE JOGO!';
document.querySelector('#menu p').textContent='Você percorreu '+Math.floor(score)+' metros!';
document.getElementById('start').textContent='JOGAR NOVAMENTE';
document.getElementById('menu').style.display='flex';
}
}
draw();
if(playing)requestAnimationFrame(loop);
}
function move(n){if(playing)player=Math.max(0,Math.min(2,player+n));}
document.getElementById('left').onclick=()=>move(-1);
document.getElementById('right').onclick=()=>move(1);
onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};
document.getElementById('start').onclick=()=>{
player=1;cars=[];score=0;spawn=0;speed=5;playing=true;
document.getElementById('menu').style.display='none';loop();
};
draw();
</script>
</body>
</html>
